name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      shell: bash
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
        ls -la app/build/outputs/apk/debug/ || true

    - name: Upload Build Log (if failed or passed)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log
        retention-days: 7

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: continueo-auto-login-debug-apk
        path: app/build/outputs/apk/debug/
        if-no-files-found: warn
        retention-days: 14
