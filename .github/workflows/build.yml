name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || {
          echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 50 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        }

    - name: Prepare APK
      run: |
        mkdir -p release-apk
        echo "=== Searching for APK files ==="
        find app/build/outputs/ -name "*.apk" -type f 2>/dev/null || echo "No APK files found!"
        echo "=== Copying APK ==="
        cp -v app/build/outputs/apk/debug/app-debug.apk release-apk/ContinueO-AutoLogin.apk
        echo "=== Verifying ==="
        ls -la release-apk/
        file release-apk/ContinueO-AutoLogin.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: continueo-auto-login-apk
        path: release-apk/ContinueO-AutoLogin.apk
        if-no-files-found: warn
        retention-days: 14

    - name: Delete old release
      run: |
        gh release delete latest --yes --cleanup-tag 2>/dev/null || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "ContinueO Auto Login (Latest Build)"
        body: |
          ### ContinueO Auto Login APK
          - Automated build generated from commit `${{ github.sha }}`
          - Direct download available below.
        files: release-apk/ContinueO-AutoLogin.apk
        fail_on_unmatched_files: true
        make_latest: true
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
