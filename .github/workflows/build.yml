name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || {
          echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 50 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        }


    - name: Prepare APK
      run: |
        mkdir -p release-apk
        echo "=== Listing all outputs ==="
        find app/build/ -type f || true
        cp app/build/outputs/apk/debug/*.apk release-apk/ || cp app/build/outputs/apk/*/*.apk release-apk/ || true
        ls -la release-apk/

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: continueo-auto-login-apk
        path: release-apk/
        if-no-files-found: warn
        retention-days: 14
