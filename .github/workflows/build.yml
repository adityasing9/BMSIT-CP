name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare APK
      shell: bash
      run: |
        mkdir -p release-apk
        echo "=== Listing all outputs ==="
        find app/build/outputs/ -type f || true
        
        APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" -type f | head -n 1)
        if [ -z "$APK_FILE" ]; then
          echo "No APK found in app/build/outputs/apk/debug/! Searching everywhere..."
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
        fi

        if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
          echo "Found APK at: $APK_FILE"
          cp -v "$APK_FILE" release-apk/ContinueO-AutoLogin.apk
          ls -lh release-apk/
        else
          echo "ERROR: No APK file was generated during build!"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: continueo-auto-login-apk
        path: release-apk/ContinueO-AutoLogin.apk
        if-no-files-found: warn
        retention-days: 14

    - name: Delete old release
      run: |
        gh release delete latest --yes --cleanup-tag 2>/dev/null || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "ContinueO Auto Login (Latest Build)"
        body: |
          ### ContinueO Auto Login APK
          - Automated build generated from commit `${{ github.sha }}`
          - Direct download available below.
        files: release-apk/ContinueO-AutoLogin.apk
        fail_on_unmatched_files: true
        make_latest: true
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
